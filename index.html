<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ma Montagne</title>
  <meta name="description" content="Mes heures de travail font grandir une station de ski miniature.">
  <meta name="theme-color" content="#141a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ma Montagne">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="veil"><span>Ma Montagne</span></div>

  <button id="counter" class="glass" aria-label="Crédits disponibles et heures travaillées">
    <svg class="mtn" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 20.5 9 6.5l3.6 6.2 2.2-3.4 7.7 11.2Z"/></svg>
    <span id="credits">0</span>
    <span id="hours">0 h</span>
  </button>
  <button id="menuBtn" class="glass round" aria-label="Menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  </button>

  <div id="fabs">
    <button id="shopBtn" class="glass round" aria-label="Améliorations">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16 16 6l12 10M7 15v11h18V15"/><rect class="f" x="13" y="18" width="6" height="5" rx="1"/></svg>
      <i class="dot" hidden></i>
    </button>
    <button id="addBtn" aria-label="Ajouter des heures">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div id="hint" class="glass" hidden>Ajoute tes heures de travail</div>

  <div id="addPop" class="glass" hidden>
    <div class="chips" id="chips"></div>
    <div class="stepper">
      <button id="minus" aria-label="Moins">−</button>
      <output id="customH">1,5 h</output>
      <button id="plus" aria-label="Plus">+</button>
      <button id="customOk">Ajouter</button>
    </div>
  </div>

  <aside id="shop" class="glass" aria-label="Améliorations">
    <div class="grab" id="grab"><i></i></div>
    <nav id="tabs"></nav>
    <div id="list"></div>
  </aside>

  <aside id="menu" class="glass" hidden>
    <div class="stats"><b id="statH">0 h</b><span id="statS"></span></div>
    <div class="row">
      <span>Ciel</span>
      <div class="seg" id="skySeg">
        <button data-sky="auto">Auto</button><button data-sky="day">Jour</button><button data-sky="dusk">Soir</button><button data-sky="night">Nuit</button>
      </div>
    </div>
    <div class="row">
      <span>Son</span>
      <button id="soundBtn" class="switch" role="switch" aria-checked="true"><i></i></button>
    </div>
    <div class="row two">
      <button id="exportBtn">Exporter</button>
      <button id="importBtn">Importer</button>
    </div>
    <p id="backupNote"></p>
    <h3>Sessions</h3>
    <ul id="history"></ul>
  </aside>

  <div id="toast" class="glass" hidden></div>
  <input type="file" id="file" accept="application/json,.json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
